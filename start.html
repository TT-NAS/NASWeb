<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="index.css">
</head>
<body id="body">

  <nav class="navbar bg-black" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/home.html">
      <img src="/img/logo-black.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
        Auto segmentation
      </a>
    </div>
  </nav>
  
  <div class="container py-5">
    <div class="row">
      <div class="col">
        <div class="card p-4 glass-card">
          <!-- Grid in card -->
          <div class="row">
            <div class="col-md">
              <form action="">
                <div class="mb-3">
                  <label for="range-population-size" class="form-label">Tamaño de la población: <output for="range-population-size" id="range-population-size-value" aria-hidden="true"></output></label>
                  <input type="range" class="form-range" min="0" max="100" value="50" id="range-population-size">
                </div>


                <div class="mb-3">
                  <label for="range-f" class="form-label">F: <output for="range-f" id="range-f-value" aria-hidden="true"></output></label>
                  <input type="range" class="form-range" min="0" max="2" step="0.01" value="0.5" id="range-f">
                </div>

                <div class="mb-3">
                  <label for="range-crossover" class="form-label">Tasa de cruza: <output for="range-crossover" id="range-crossover-value" aria-hidden="true"></output></label>
                  <input type="range" class="form-range" min="0" max="1" step="0.01" value="0.5" id="range-crossover">
                </div>

                <div class="mb-3">
                  <label for="range-mutation" class="form-label">Tasa de mutación: <output for="range-mutation" id="range-mutation-value" aria-hidden="true"></output></label>
                  <input type="range" class="form-range" min="0" max="1" step="0.01" value="0.01" id="range-mutation">
                </div>

                <div class="mb-3">
                  <label for="range-generations" class="form-label">Generaciones: <output for="range-generations" id="range-generations-value" aria-hidden="true"></output></label>
                  <input type="range" class="form-range" min="1" max="1000" value="100" id="range-generations">
                </div>

                <div class="form-check">
                  <input type="checkbox" class="form-check-input checkbox-purple" id="checkbox">
                  <label for="checkbox" class="form-check-label">
                    Entrenar arquitectura final
                  </label>
                </div>

                <div class="d-grid gap-2">
                  <button class="btn btn-primary mt-4">Iniciar búsqueda</button>
                </div>
              </form>
            </div>
            <div class="col-md">
              <div class="card p-1 bg-light mt-2" >
                <div id="animation" style="width: auto; height: 300px"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.dots.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>
<script>
  VANTA.DOTS({
    el: "#body",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    scale: 1.00,
    scaleMobile: 1.00,
    color: 0x773ec7,
    backgroundColor: 0x000000,
    color2: 0x773ec7
  })

  VANTA.NET({
    el: "#animation",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 50.00,
    minWidth: 50.00,
    scale: 1.00,
    scaleMobile: 1.00,
    color: 0xff3f81,
    backgroundColor: 0x000000,
    color2: 0x773ec7
  })
</script>

</body>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js" integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK" crossorigin="anonymous"></script>
<script src="./js/start.form.js"></script>
</html>
